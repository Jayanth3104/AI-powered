<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ambulance Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h2 class="mb-4 text-center">🚑 Ambulance Detection System</h2>

  <!-- Image Upload -->
  <form action="/upload_image" method="post" enctype="multipart/form-data" class="mb-3">
    <div class="input-group">
      <input type="file" class="form-control" name="image" required>
      <button class="btn btn-primary" type="submit">Upload Image</button>
    </div>
  </form>

  <!-- Video Upload -->
  <form action="/upload_video" method="post" enctype="multipart/form-data" class="mb-3">
    <div class="input-group">
      <input type="file" class="form-control" name="video" required>
      <button class="btn btn-success" type="submit">Upload Video</button>
    </div>
  </form>

  <!-- Live Webcam -->
  <div class="mb-3">
    <h5>Live Webcam Stream</h5>
    <img src="{{ url_for('video_feed') }}" width="640" height="480">
  </div>

  <!-- Show Results -->
  {% if result_img %}
  <h5>Processed Image:</h5>
  <img src="{{ result_img }}" class="img-fluid">
  {% endif %}

  {% if result_video %}
  <h5>Processed Video:</h5>
  <video src="{{ result_video }}" controls class="w-100"></video>
  {% endif %}

</body>
</html>
