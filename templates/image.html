<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ambulance Detection - Image Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .upload-box {
      border: 2px dashed #0d6efd;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s;
    }
    .upload-box.dragover {
      background: #e9f3ff;
    }
    .preview-img {
      max-width: 100%;
      height: auto;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .result-card {
      margin-top: 30px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body class="p-5">

  <div class="container">
    <h2 class="mb-4 text-primary">🚑 Ambulance Detection (Image Upload)</h2>

    <!-- Upload Form -->
    <form id="uploadForm" action="/upload_image" method="post" enctype="multipart/form-data">
      <div id="uploadBox" class="upload-box">
        <p class="text-muted">Drag & drop an image here or click to select</p>
        <input type="file" id="fileInput" name="image" accept="image/*" hidden required>
        <button type="button" class="btn btn-outline-primary mt-2" onclick="document.getElementById('fileInput').click()">Choose File</button>
      </div>

      <!-- Preview Before Upload -->
      <div id="previewContainer" class="mt-3" style="display:none;">
        <h5>Preview:</h5>
        <img id="previewImage" class="preview-img" alt="Preview">
      </div>

      <button type="submit" class="btn btn-primary mt-3">Upload & Detect</button>
    </form>

    <!-- Detection Result -->
    {% if result_img %}
    <div class="card result-card shadow">
      <div class="card-header bg-success text-white">
        Detection Result
      </div>
      <div class="card-body text-center">
        <img src="{{ url_for('static', filename=result_img) }}" 
             alt="Detection Result" 
             class="img-fluid rounded shadow">
      </div>
    </div>
    {% endif %}

    <a href="/" class="btn btn-secondary mt-4">⬅ Back</a>
  </div>

  <script>
    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const previewContainer = document.getElementById("previewContainer");
    const previewImage = document.getElementById("previewImage");

    // Drag & Drop
    uploadBox.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadBox.classList.add("dragover");
    });
    uploadBox.addEventListener("dragleave", () => {
      uploadBox.classList.remove("dragover");
    });
    uploadBox.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadBox.classList.remove("dragover");
      fileInput.files = e.dataTransfer.files;
      showPreview(fileInput.files[0]);
    });

    // Preview Before Upload
    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files[0]) {
        showPreview(fileInput.files[0]);
      }
    });

    function showPreview(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        previewContainer.style.display = "block";
        previewImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>

</body>
</html>
